[package]
name = "ragflow"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
hyper = { version = "0.14", features = ["full"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
env_logger = "0.10"
log = "0.4"
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "catch-panic", "compression-gzip"] }
tracing = "0.1"
tracing-subscriber = "0.3"
async-trait = "0.1"
sea-orm = { version = "0.12", features = ["sqlx-mysql", "sqlx-postgres", "runtime-tokio", "macros", "debug-print"] }
sqlx = { version = "0.7", features = ["mysql", "postgres", "runtime-tokio"] }
bcrypt = "0.15"
validator = { version = "0.18", features = ["derive"] }
sha2 = "0.10"

[dev-dependencies]
sea-orm = { version = "0.12", features = ["sqlx-sqlite", "runtime-tokio", "macros", "debug-print"] }
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio"] }
tempfile = "3.10"
